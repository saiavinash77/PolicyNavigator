[project]
name = "policynavigator"
version = "0.2.1"
description = "LangChain RAG + Groq for policy research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "python-dotenv",
  "python-multipart",
  "pydantic",
  "langchain",
  "langchain-community",
  "langchain-text-splitters",
  "langchain-groq",
  "groq",
  "faiss-cpu",
  "fastembed",
  "pypdf",
  "numpy",
]

[tool.uv]
package = false
